<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOAM — Un mundo vivo</title>
<style>
:root{--ink:#1d2921;--line:#dde3d8}*{box-sizing:border-box}body{margin:0;background:#edf0e7;color:var(--ink);font-family:Georgia,serif}.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-size:22px;letter-spacing:5px}.tag{font:9px Arial,sans-serif;color:#879087;letter-spacing:2px;margin-left:12px}.layout{height:calc(100vh - 62px);display:grid;grid-template-columns:minmax(0,1fr) 300px}.main{padding:20px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.head h1{margin:4px 0 0;font-size:26px;font-weight:normal}.head small{font:9px monospace;color:#7d887d}.controls button,.topbar button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 11px;color:var(--ink);cursor:pointer}.world{height:calc(100vh - 145px);min-height:420px;border-radius:14px;overflow:hidden;position:relative;background:#8ca98a;box-shadow:0 8px 30px #344b3a20}.canvas{width:100%;height:100%;display:block}.tools{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;background:#fffdf2e8;border:1px solid #fff;border-radius:10px;padding:6px;gap:3px}.tools button{border:0;background:transparent;padding:9px 10px;border-radius:7px;cursor:pointer;color:#59665c;font:11px Arial}.tools button.on{background:#dde7d3}.maplabel{position:absolute;top:14px;left:14px;background:#fffdf1dd;border-radius:7px;padding:8px 10px;font:10px monospace}.sidebar{background:#fff;border-left:1px solid var(--line);padding:18px;overflow:auto}.section{border-bottom:1px solid #ecefe7;padding-bottom:15px;margin-bottom:15px}.section h2{font:11px Arial;margin:0 0 12px;text-transform:uppercase;letter-spacing:1px;color:#59645b}.population{display:flex;align-items:end;gap:12px}.population b{font-size:43px;font-weight:normal}.population span{font:11px Arial;color:#7b847a;margin-bottom:7px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.stat{background:#f7f8f2;border-radius:7px;padding:9px;font:10px Arial}.bar{height:3px;margin-top:7px;background:#e4e8dd}.bar i{display:block;height:100%;background:#86a177}.event{font:11px Arial;line-height:1.5;color:#667269;margin:8px 0}.event b{color:#34443a}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,18px);background:#26372b;color:#fff;padding:11px 16px;border-radius:8px;opacity:0;transition:.2s;font:11px Arial}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{display:none}.world{height:calc(100vh - 145px)}}
</style>
</head>
<body>
<header class="topbar"><div><span class="brand">LOAM</span><span class="tag">UN MUNDO QUE NO TE PERTENECE</span></div><div><button id="pause">Ⅱ Pausar</button></div></header>
<main class="layout"><section class="main"><div class="head"><div><small>OBSERVATORIO · VALLE SIN FRONTERAS</small><h1>El valle de lo que será</h1></div><div class="controls"><button id="speed">Velocidad · 1×</button></div></div><div class="world"><canvas id="world" class="canvas"></canvas><div class="maplabel" id="label">☀ Templado · Día 1</div><div class="tools"><button class="on" data-tool="observe">◉ Observar</button><button data-tool="gift">✧ Regalar</button><button data-tool="weather">☁ Clima</button><button data-tool="destroy">⌁ Destruir</button></div></div></section><aside class="sidebar"><section class="section"><h2>Los habitantes</h2><div class="population"><b id="pop">6</b><span>vidas en el valle<br>Generación 1</span></div><div class="stats"><div class="stat">Alimento <b id="fv"></b><div class="bar"><i id="fb"></i></div></div><div class="stat">Agua <b id="wv"></b><div class="bar"><i id="wb" style="background:#82adb4"></i></div></div><div class="stat">Refugio <b id="sv"></b><div class="bar"><i id="sb" style="background:#c9a76b"></i></div></div><div class="stat">Ánimo <b id="mv"></b><div class="bar"><i id="mb" style="background:#a58db3"></i></div></div></div></section><section class="section"><h2>Crónica</h2><div id="history"></div></section></aside></main>
<div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let W=0,H=0,dpr=1,t=0,last=0,paused=false,speed=1,tool='observe',day=1,weather='sun',camera=0,selected=-1,toastTimer;
const names=['Aru','Nima','Oren','Seli','Tavi','Uma','Eren','Luma','Ivo','Mara','Yani','Koa','Neri','Tala','Soma','Aren','Miri','Eka','Noa','Veli'];
const state={food:72,water:81,shelter:18,mood:76,people:[],homes:[],events:[]};
for(let i=0;i<6;i++)state.people.push({name:names[i],x:.42+i*.035,y:.67+rnd(-.04,.10),tx:rnd(.20,.80),phase:rnd(0,6),hue:rnd(0,1),trait:pick(['curiosa','prudente','soñadora','tenaz','generosa']),age:18+rnd(0,30),need:'wander',timer:rnd(1,4),carry:false});
for(let i=0;i<10;i++)state.homes.push({x:.38+i*.045,y:.70+rnd(-.03,.12)});
function resize(){let r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function log(text){state.events.unshift(text);state.events=state.events.slice(0,7);$('#history').innerHTML=state.events.map(e=>'<div class="event">'+e+'</div>').join('')}
function ui(){$('#pop').textContent=state.people.length;for(const [k,v] of Object.entries({f:state.food,w:state.water,s:state.shelter,m:state.mood})){$('#'+k+'v').textContent=Math.round(v)+'%';$('#'+k+'b').style.width=Math.round(v)+'%'}$('#label').textContent=(weather==='sun'?'☀ Templado':weather==='rain'?'☂ Lluvia':weather==='snow'?'❄ Nieve':'♨ Sequía')+' · Día '+day}
function toast(m){let e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1800)}
function groundY(x){return H*(.67+Math.sin((x+camera)*.008)*.035+Math.sin((x+camera)*.019)*.012)}
function tree(x,y,s=1,pine=false){ellipse(x,y+3*s,22*s,7*s,'#43543b28');ctx.fillStyle='#70543d';ctx.fillRect(x-3*s,y-28*s,6*s,31*s);if(pine){for(let i=0;i<4;i++){ctx.fillStyle=i%2?'#3f6549':'#527553';ctx.beginPath();ctx.moveTo(x,y-(48-i*7)*s);ctx.lineTo(x-(19-i)*s,y-(20-i*8)*s);ctx.lineTo(x+(19-i)*s,y-(20-i*8)*s);ctx.closePath();ctx.fill()}}else{ellipse(x,y-36*s,18*s,20*s,'#527755');ellipse(x-12*s,y-31*s,13*s,15*s,'#66885f');ellipse(x+12*s,y-33*s,14*s,17*s,'#456d4d');ellipse(x-3*s,y-47*s,13*s,13*s,'#739365')}}
function hut(x,y,s=1){ellipse(x,y+4*s,18*s,5*s,'#3d49334f');ctx.fillStyle='#a17b52';ctx.fillRect(x-12*s,y-14*s,24*s,15*s);ctx.fillStyle='#72533d';ctx.beginPath();ctx.moveTo(x-17*s,y-13*s);ctx.lineTo(x,y-31*s);ctx.lineTo(x+17*s,y-13*s);ctx.closePath();ctx.fill();ctx.fillStyle='#4b4032';ctx.fillRect(x-4*s,y-10*s,7*s,11*s);ctx.fillStyle='#d4bc82';ctx.fillRect(x+7*s,y-11*s,4*s,5*s)}
function person(p,i){let x=p.x*W,y=p.y*H,b=Math.sin(t*5+p.phase)*1.5,s=Math.max(.85,Math.min(1.15,W/780));ellipse(x,y+3*s,6*s,2*s,'#38453540');ctx.strokeStyle='#594e40';ctx.lineWidth=1.5*s;ctx.beginPath();ctx.moveTo(x-1*s,y-5*s-b);ctx.lineTo(x-3*s,y);ctx.moveTo(x+1*s,y-5*s-b);ctx.lineTo(x+3*s,y);ctx.stroke();ctx.fillStyle=['#718862','#a8775f','#687f83','#b39a62','#8b7180'][Math.floor(p.hue*5)];ctx.beginPath();ctx.roundRect(x-4*s,y-13*s-b,8*s,10*s,2*s);ctx.fill();ellipse(x,y-17*s-b,3.5*s,3.7*s,['#bd8b68','#d9ad83','#926b56','#dfb78b'][Math.floor(p.hue*4)]);ctx.fillStyle='#504337';ctx.beginPath();ctx.arc(x,y-18*s-b,3.5*s,Math.PI,0);ctx.fill();if(selected===i){ctx.strokeStyle='#fff1aa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-10*s,13*s,0,Math.PI*2);ctx.stroke()}}
function draw(){t+=.016;ctx.clearRect(0,0,W,H);
let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,weather==='storm'?'#7f969d':weather==='snow'?'#b7ccd4':weather==='drought'?'#cbb586':'#9dc9d5');sky.addColorStop(.65,weather==='storm'?'#c1c6b7':'#ebdcb6');sky.addColorStop(1,'#b5c79a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// sun and distant clouds
if(weather==='sun'||weather==='drought'){ellipse(W*.82,H*.17,13,13,'#fff1b9')}else if(weather==='rain'||weather==='snow'){ellipse(W*.22,H*.16,45,12,'#e6ebe055');ellipse(W*.28,H*.15,32,10,'#e6ebe055')}
// three real mountain bands
for(let layer=0;layer<3;layer++){let base=[.42,.50,.58][layer],colors=['#91a997','#789581','#667f69'][layer];ctx.fillStyle=colors;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+5;x+=5){let wx=x+camera*(.12+layer*.12),y=base+Math.sin(wx*.007+layer*1.8)*.055+Math.sin(wx*.018+layer)*.024;ctx.lineTo(x,H*y)}ctx.lineTo(W,H);ctx.closePath();ctx.fill();if(layer===0){ctx.fillStyle='#e8ead7aa';for(let i=0;i<7;i++){let x=i*W/6-camera*.08%W,y=H*(.35+(i%3)*.025);ctx.beginPath();ctx.moveTo(x-28,y+24);ctx.lineTo(x,y-12);ctx.lineTo(x+28,y+24);ctx.fill()}}}
// rolling meadow
let g=ctx.createLinearGradient(0,H*.58,0,H);g.addColorStop(0,weather==='drought'?'#bcae74':'#9eb783');g.addColorStop(1,weather==='snow'?'#bdcbae':'#7d9a67');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+5;x+=5)ctx.lineTo(x,groundY(x));ctx.lineTo(W,H);ctx.fill();
// river
ctx.beginPath();for(let y=H*.31;y<H*1.08;y+=4){let x=W*.62+Math.sin(y*.012)*W*.075+Math.sin(y*.032)*W*.025;if(y===H*.31)ctx.moveTo(x,y);else ctx.lineTo(x,y)}for(let y=H*1.08;y>=H*.31;y-=4)ctx.lineTo(W*.62+Math.sin(y*.012)*W*.075+Math.sin(y*.032)*W*.025+H*.105,y);ctx.closePath();ctx.fillStyle='#789f98';ctx.fill();ctx.strokeStyle='#d7e7d0aa';ctx.lineWidth=2;ctx.beginPath();for(let y=H*.38;y<H*.98;y+=16){let x=W*.62+Math.sin(y*.012)*W*.075+Math.sin(y*.032)*W*.025+H*.052;y===H*.38?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();
// footpath
ctx.strokeStyle='#b2a373';ctx.lineWidth=20;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-20,H*.82);ctx.bezierCurveTo(W*.22,H*.77,W*.34,H*.91,W*.48,H*.84);ctx.bezierCurveTo(W*.61,H*.78,W*.58,H*.68,W*.62,H*.70);ctx.stroke();ctx.strokeStyle='#d2c18e';ctx.lineWidth=14;ctx.stroke();
// trees and forest
for(let i=-2;i<18;i++){let x=i*W/13-camera*.15*0;let y=groundY(x)-H*(.10+(i%4)*.025);tree(x,y,.68+(i%3)*.12,i%4===0)}
for(let i=0;i<30;i++){let x=((i*173-camera*.4)% (W+180))-90,y=H*(.65+(i*47%260)/900);if(y>H*.57&&y<H*.94)tree(x,y,.72+(i%5)*.07,i%3===0)}
// meadow details
for(let i=0;i<110;i++){let x=(i*83-camera*.25)%(W+40)-20,y=H*(.58+(i*37%360)/900);if(y>groundY(x)-40&&y<H*.98){let s=.45+(i%4)*.12;if(i%4===0){ellipse(x,y,3*s,2*s,'#6c8055');ctx.strokeStyle='#6c8055';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-8*s);ctx.stroke();ellipse(x,y-9*s,2*s,2*s,i%8?'#eddaa0':'#e6a9a0')}else if(i%4===1){ellipse(x,y,7*s,4*s,'#668052');ellipse(x+4*s,y-3*s,5*s,4*s,'#7f9764')}else{ctx.strokeStyle='#728956';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3*s,y-7*s);ctx.moveTo(x,y);ctx.lineTo(x+3*s,y-8*s);ctx.stroke()}}}
// village homes
state.homes.forEach((h,i)=>{if(i<clamp(Math.floor(state.shelter/8),3,10))hut(h.x*W,h.y*H,.82+(i%3)*.06)});
// inhabitants
state.people.forEach(person);
// weather
if(weather==='rain'||weather==='storm'){ctx.strokeStyle='#edf6f3aa';ctx.lineWidth=1;for(let i=0;i<90;i++){let x=(i*97+t*(weather==='storm'?180:75))%W,y=(i*53+t*210)% (H*.78);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-4,y+10);ctx.stroke()}}else if(weather==='snow'){for(let i=0;i<55;i++)ellipse((i*89+t*12)%W,(i*73+t*21)% (H*.84),1.5,1.5,'#fffef1cc')}
requestAnimationFrame(draw)}
function step(dt){if(paused)return;for(const p of state.people){p.timer-=dt;if(p.timer<=0){p.timer=rnd(2,5);p.need=p.need==='gather'?'wander':'gather';p.tx=rnd(.15,.82)}let dx=p.tx-p.x;if(Math.abs(dx)>.008)p.x+=Math.sign(dx)*.018*dt*speed;if(p.need==='gather'&&Math.abs(dx)<.035){state.food=clamp(state.food+.015*dt*speed,0,100);p.carry=true}else p.carry=false;p.age+=dt*.005}t+=dt*speed;day=Math.floor(t/8)+1;if(Math.floor(t)%18===0&&state.people.length<12&&Math.random()<.002*speed&&state.food>40&&state.water>35){let p={name:names[state.people.length%names.length],x:rnd(.42,.58),y:rnd(.68,.82),tx:rnd(.2,.8),phase:rnd(0,6),hue:rnd(0,1),trait:'nueva',age:0,timer:rnd(1,4),carry:false};state.people.push(p);log('<b>'+p.name+'</b> nació en el valle.')}state.food=clamp(state.food-dt*.006*state.people.length*speed,0,100);state.water=clamp(state.water-dt*.004*speed+(weather==='rain'?.015*dt*speed:0),0,100);if(weather==='drought')state.water=clamp(state.water-dt*.012*speed,0,100);ui();}
let raf;function loop(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;step(dt);requestAnimationFrame(loop)}
window.addEventListener('resize',resize);document.querySelectorAll('.tools button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tools button').forEach(x=>x.classList.remove('on'));b.classList.add('on');tool=b.dataset.tool});canvas.onpointerdown=e=>{let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/W,y=(e.clientY-r.top)/H;if(tool==='observe'){let best=-1,bd=99;state.people.forEach((p,i)=>{let d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best=i}});selected=best;if(best>=0)toast(state.people[best].name+' · '+state.people[best].trait)}else if(tool==='gift'){state.food=clamp(state.food+20,0,100);state.shelter=clamp(state.shelter+5,0,100);log('Una ofrenda apareció junto al sendero.');toast('Los habitantes decidirán qué hacer con ella')}else if(tool==='weather'){weather=pick(['sun','rain','storm','snow','drought']);ui();toast('El cielo ha cambiado')}else{state.mood=clamp(state.mood-10,0,100);log('Una cicatriz apareció en el valle.');toast('El valle lo recordará')}};$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'▶ Continuar':'Ⅱ Pausar'};$('#speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('#speed').textContent='Velocidad · '+speed+'×'};
resize();ui();log('<b>Seis seres</b> abrieron los ojos bajo un cielo nuevo.');log('Un arroyo busca su camino entre la hierba.');requestAnimationFrame(draw);requestAnimationFrame(loop)})();
</script>
</body>
</html>
